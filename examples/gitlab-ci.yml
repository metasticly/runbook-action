# GitLab CI: open the release checklist for every tag, and block the deploy job until it is completed.
#
# Setup:
#   1. Copy scripts/start-run.sh from github.com/metasticly/runbook-action into your repo as
#      ci/runbook-start-run.sh, or download a pinned release of it in before_script:
#        curl -fsSLo ci/runbook-start-run.sh https://raw.githubusercontent.com/metasticly/runbook-action/v1.0.0/scripts/start-run.sh
#   2. Add a masked, protected CI/CD variable RUNBOOK_API_TOKEN (Settings -> CI/CD -> Variables).
#   3. Merge these jobs into your .gitlab-ci.yml.
stages: [checklist, deploy]

.runbook:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq >/dev/null
  variables:
    RUNBOOK_BASE_URL: https://runbook.metastic.ch
    RUNBOOK_TEMPLATE: release-version            # template slug (or id, or exact name)
    RUNBOOK_IDEMPOTENCY_KEY: "$CI_PIPELINE_ID"    # a retried job returns the run it already opened
    RUNBOOK_TITLE: "Release $CI_COMMIT_TAG"
    RUNBOOK_VARIABLES: "version=$CI_COMMIT_TAG"

release-checklist:
  extends: .runbook
  stage: checklist
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    RUNBOOK_WAIT: "true"      # fail this job unless the run is completed in time
    RUNBOOK_TIMEOUT: "3600"
  script:
    - set -o pipefail
    - bash ci/runbook-start-run.sh | tee runbook.out
    # Expose the run to later jobs as $RUNBOOK_RUN_ID / $RUNBOOK_RUN_URL.
    - sed -n -e 's/^run-id=/RUNBOOK_RUN_ID=/p' -e 's/^run-url=/RUNBOOK_RUN_URL=/p' runbook.out | sort -u > runbook.env
  artifacts:
    reports:
      dotenv: runbook.env

deploy:
  stage: deploy
  needs: [release-checklist]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Checklist $RUNBOOK_RUN_URL completed, deploying $CI_COMMIT_TAG"
    # - ./deploy.sh
